<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1E"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#141E36"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="vf-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Left Shield Facet (Electric Sapphire to Blue) -->
    <linearGradient id="vf-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <!-- Right Shield Facet (Vivid Emerald to Mint) -->
    <linearGradient id="vf-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="vf-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Checkmark -->
    <filter id="vf-check-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#vf-bg)"/>
  <rect x="2" y="2" width="116" height="116" rx="28" fill="none" stroke="url(#vf-border)" stroke-width="1.2"/>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="38" fill="url(#vf-glow)"/>

  <!-- Shield Left Facet -->
  <path d="M 60,32 L 32,24 C 32,58 44,82 60,94 Z" fill="url(#vf-blue)"/>

  <!-- Shield Right Facet -->
  <path d="M 60,32 L 88,24 C 88,58 76,82 60,94 Z" fill="url(#vf-green)"/>

  <!-- Checkmark -->
  <path d="M 43,56 L 55,68 L 77,42" fill="none" stroke="#FFFFFF" stroke-width="7.5"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#vf-check-shadow)"/>
</svg>
